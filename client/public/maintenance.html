<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <meta name="robots" content="noindex" />
        <title>Scheduled maintenance | EstateHub</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                padding: 24px;
                background: #10141c;
                color: #f5f7fa;
                font:
                    16px/1.7 system-ui,
                    sans-serif;
            }
            main {
                max-width: 520px;
                width: 100%;
                border: 1px solid #354052;
                border-radius: 24px;
                padding: 40px;
                background: #19212d;
            }
            svg {
                width: 48px;
                height: 48px;
                color: #e4a094;
            }
            small {
                color: #e4a094;
                letter-spacing: 0.15em;
                font-weight: 700;
            }
            h1 {
                font-size: 32px;
                line-height: 1.2;
            }
            p {
                color: #bbc5d3;
            }
            a {
                display: inline-block;
                border-radius: 12px;
                background: #e4a094;
                color: #171b23;
                font-weight: 600;
                padding: 14px 24px;
                text-decoration: none;
            }
            a:focus-visible {
                outline: 3px solid white;
                outline-offset: 4px;
            }
        </style>
    </head>
    <body>
        <main>
            <small>ESTATEHUB</small>
            <p>
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    aria-hidden="true"
                >
                    <path
                        d="M14.7 6.3a5 5 0 0 0-6.4 6.4L3 18l3 3 5.3-5.3a5 5 0 0 0 6.4-6.4l-3 3-3-3z"
                    />
                </svg>
            </p>
            <h1>We'll be back soon</h1>
            <p>
                EstateHub is temporarily unavailable while we carry out
                maintenance. Account, messaging and payment actions are paused.
            </p>
            <p>Please check back shortly. Thank you for your patience.</p>
            <a href="/">Check again</a>
        </main>
    </body>
</html>

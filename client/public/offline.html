<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <meta name="robots" content="noindex" />
        <title>EstateHub is temporarily unavailable</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                min-height: 100svh;
                display: grid;
                place-items: center;
                padding: 20px;
                background: radial-gradient(circle at 50% 0%, #23202b 0, #10131d 38%, #090d16 78%);
                color: #f8f5f4;
                font: 16px/1.6 system-ui, sans-serif;
            }
            main {
                width: 100%;
                max-width: 620px;
                overflow: hidden;
                border: 1px solid #343544;
                border-radius: 28px;
                padding: clamp(28px, 6vw, 48px);
                background: linear-gradient(145deg, #1c1e2b, #111622 80%);
                box-shadow: 0 32px 90px #0007;
            }
            header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
                padding-bottom: 24px;
                border-bottom: 1px solid #343544;
            }
            .brand {
                color: #f8f5f4;
                font-size: 17px;
                font-weight: 800;
                letter-spacing: -0.04em;
                white-space: nowrap;
            }
            .brand span {
                color: #eca7a3;
                font-weight: 500;
            }
            .label {
                color: #f1aaa7;
                font-size: 11px;
                font-weight: 700;
                letter-spacing: .14em;
                text-transform: uppercase;
            }
            .icon {
                display: grid;
                place-items: center;
                width: 48px;
                height: 48px;
                margin-top: 36px;
                border: 1px solid #794b54;
                border-radius: 16px;
                background: #4a303b;
                color: #f5bab5;
            }
            svg {
                width: 25px;
                height: 25px;
            }
            h1 {
                max-width: 500px;
                margin: 22px 0 0;
                font-size: clamp(30px, 5vw, 43px);
                line-height: 1.12;
                letter-spacing: -.045em;
            }
            #description {
                max-width: 510px;
                margin: 18px 0 0;
                color: #c4c6d1;
                font-size: 17px;
                line-height: 1.65;
            }
            .actions {
                display: flex;
                align-items: center;
                gap: 20px;
                margin-top: 34px;
                padding-top: 28px;
                border-top: 1px solid #343544;
            }
            #status {
                margin: 0;
                color: #aeb1c0;
                font-size: 13px;
                line-height: 1.5;
            }
            button {
                border: 0;
                border-radius: 999px;
                background: #eda9a5;
                color: #1a141b;
                font: 700 15px system-ui;
                padding: 14px 25px;
                cursor: pointer;
                white-space: nowrap;
                transition: background .15s ease, transform .15s ease;
            }
            button:hover {
                background: #fac2be;
                transform: translateY(-1px);
            }
            button:focus-visible {
                outline: 3px solid white;
                outline-offset: 4px;
            }
            @media (max-width: 480px) {
                header { padding-bottom: 20px; }
                .label { font-size: 10px; text-align: right; }
                .icon { margin-top: 28px; }
                .actions { align-items: stretch; flex-direction: column; gap: 14px; }
                button { width: 100%; }
            }
        </style>
    </head>
    <body>
        <main>
            <header>
                <div class="brand">ESTATE<span>HUB</span></div>
                <div class="label">Connection update</div>
            </header>
            <div class="icon">
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    aria-hidden="true"
                >
                    <circle cx="12" cy="12" r="10" />
                    <path d="M12 11v6m0-10h.01" />
                </svg>
            </div>
            <h1 id="heading">EstateHub is temporarily unavailable</h1>
            <p id="description">We couldn't reach EstateHub. The website may be temporarily unavailable.</p>
            <div class="actions">
                <button id="retry" type="button">Try again</button>
                <p id="status" role="status" aria-live="polite">Your connection may still be working. Please check back shortly.</p>
            </div>
        </main>
        <script>
            const heading = document.getElementById("heading");
            const description = document.getElementById("description");
            const statusText = document.getElementById("status");
            function update() {
                if (navigator.onLine) {
                    document.title = "EstateHub is temporarily unavailable";
                    heading.textContent = "EstateHub is temporarily unavailable";
                    description.textContent = "We couldn't reach EstateHub. The website may be temporarily unavailable.";
                    statusText.textContent = "Your connection may still be working. Please check back shortly.";
                } else {
                    document.title = "Connection unavailable | EstateHub";
                    heading.textContent = "Your browser is offline";
                    description.textContent = "Your browser reports that it has no network connection. Check your connection, then try again.";
                    statusText.textContent = "Your account data is not stored on this page.";
                }
            }
            window.addEventListener("online", update);
            window.addEventListener("offline", update);
            document.getElementById("retry").addEventListener("click", () => {
                if (navigator.onLine) {
                    location.reload();
                } else {
                    update();
                }
            });
            update();
        </script>
    </body>
</html>
